# Upsun configuration to use the existing Dockerfile
applications:
  edosta:
    type: "docker"
    build:
      flavor: none
    # Tell Upsun to use the Dockerfile in the root
    source:
      root: "."
    # Expose the web port (adjust if your Dockerfile uses a different port)
    web:
      commands:
        start: "apache2-foreground"
      locations:
        /:
          passthru: true

services:
  db:
    type: postgresql:18

routes:
  https://{default}/:
    type: upstream
    upstream: edosta:http