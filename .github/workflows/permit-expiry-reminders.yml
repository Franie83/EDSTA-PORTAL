name: Tourism Permit Expiry Reminders

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      simulated_date:
        description: 'Optional simulated today (YYYY-MM-DD); leave blank for real date'
        required: false
        type: string

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protected Laravel reminder command
        env:
          PERMIT_REMINDER_SECRET: ${{ secrets.PERMIT_REMINDER_SECRET }}
          SIMULATED_DATE: ${{ inputs.simulated_date }}
        run: |
          if [ -z "$PERMIT_REMINDER_SECRET" ]; then
            echo "Missing PERMIT_REMINDER_SECRET repository secret." >&2
            exit 1
          fi

          if [ -n "$SIMULATED_DATE" ]; then
            if ! [[ "$SIMULATED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Simulated date must use YYYY-MM-DD." >&2
              exit 1
            fi

            curl --fail-with-body --silent --show-error \
              --max-time 120 \
              -X POST \
              -H "Authorization: Bearer ${PERMIT_REMINDER_SECRET}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data "{\"date\":\"${SIMULATED_DATE}\"}" \
              "https://edo-odyssey-38m3.onrender.com/api/internal/permit-expiry-reminders/run"
          else
            curl --fail-with-body --silent --show-error \
              --max-time 120 \
              -X POST \
              -H "Authorization: Bearer ${PERMIT_REMINDER_SECRET}" \
              -H "Accept: application/json" \
              "https://edo-odyssey-38m3.onrender.com/api/internal/permit-expiry-reminders/run"
          fi
